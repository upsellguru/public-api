        category:
          $ref: "#/components/schemas/ExtraTypeCategory"
    ExtraTypeStatus:
      type: string
      description: This enum describes all possible status an extra type can be in UpsellGuru
      enum:
        - ONLINE
        - OFFLINE
        - DELETED
    ExtraTypeBillingRule:
      type: string
      enum:
        - PERSON
        - DAY_PERSON
        - DAY
        - UNIT
        - RESERVATION
    ExtraTypeSalesType:
      type: string
      enum:
        - INSTANT_CONFIRMATION
        - BIDDING
        - ON_REQUEST
    ExtraTypeCategory:
      type: string
      enum:
        - F_AND_B
        - F_AND_B_BREAKFAST
        - F_AND_B_DINNER
        - EXTENDED_STAY
        - EXTENDED_STAY_ECI
        - EXTENDED_STAY_LCO
        - SPA
        - ACTIVITIES
        - TRANSPORTATION
        - ROOM_AMENITIES
        - PACKAGES
        - CLUB_BENEFITS
        - LOYALTY
    ExtraTypePointOfSale:
      type: string
      enum:
        - ALL
        - PRESTAY_ONLY
        - INHOUSE_ONLY
    ExtraTypeOfferedDays:
      type: object
      properties:
        mon:
          type: boolean
        tue:
          type: boolean
        wed:
          type: boolean
        thu:
          type: boolean
        fri:
          type: boolean
        sat:
          type: boolean
        sun:
          type: boolean
    ExtraTypeOfferedDaysType:
      type: string
      enum:
        - CHECKIN
        - STAY
        - CHECKOUT
    ExtraTypeDayTimeConfirmation:
      type: string
      enum:
        - NOT_REQUIRED
        - ANY_TIME
        - SPECIFIC_HOURS
    ExtraTypeDayTimeConfirmationSchedule:
      type: object
      properties:
        hoursFrom:
          type: integer
        hoursTo:
          type: integer
        minutesFrom:
          type: integer
        minutesTo:
          type: integer
    ExtraTypeVariation:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hotelId:
          type: integer
        status:
          $ref: "#/components/schemas/ExtraTypeStatus"
        position:
          type: integer
        code:
          type: string
        pmsTransactionCode:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        names:
          $ref: "#/components/schemas/LocalizedStringsMap"
    HotelAvailability:
      type: object
      properties:
        hotelId:
          type: integer
        availability:
          $ref: "#/components/schemas/ArrayOfRoomTypeAvailability"
    ArrayOfRoomTypeAvailability:
      type: array
      items:
        $ref: "#/components/schemas/RoomTypeAvailability"
    RoomTypeAvailability:
      type: object
      properties:
        roomTypeCode:
          type: string
        date:
          type: string
          format: date
        available:
          type: integer
        booked:
          type: integer
    BasicUser:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BasicUserStatus"
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        hotelIds:
          type: array
          items:
            type: integer
    User:
      allOf:
        - $ref: "#/components/schemas/BasicUser"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            lastLoginAt:
              type: string
              format: date-time
            status:
              $ref: "#/components/schemas/UserStatus"
    UserAccessToken:
      type: object
      properties:
        accessToken:
          type: string
    ArrayOfUser:
      type: array
      items:
        $ref: "#/components/schemas/User"
    UserStatus:
      type: string
      enum:
        - ACTIVE
        - DELETED
        - PENDING
        - SUSPENDED
        - CONFIRMED
        - TEMP_LOCKED
        - LOCKED
    BasicUserStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - DELETED
    LocalizedStringsMap:
      type: object
      additionalProperties:
        type: string
      example:
        en: "Text in English"
        es: "Texto en español"
        it: "Testo in italiano"
        de: "Text auf Deutsch"
    PictureUrl:
      type: string
      format: url
    ChannelHotelSetup:
      type: object
      properties:
        channelName:
          type: string
        channelHotelIdentifier:
          type: string
    City:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          $ref: "#/components/schemas/Country"
    Country:
      type: object
      properties:
        id:
          type: integer
        isoCode:
          type: string
        name:
          type: string
    Money:
      type: object
      properties:
        amount:
          type: number
          format: float
        currency:
          type: string
      required:
        - amount
        - currency
    LanguageCode:
      type: string
      enum:
        - EN
        - ES
        - IT
        - FR
        - PT
        - DE
        - GE
        - JP
        - CN
        - RU
        - NL
        - TR
        - PL
        - ID
        - BG
        - CZ
        - ZH
    SaveBookedExtraRequest:
      type: object
      required:
        - hotelId
        - reservationId
        - extraTypeId
        - touchpoint
        - sourceChannel
        - price
        - quantity
      properties:
        hotelId:
          type: integer
          description: The Hotel ID
        reservationId:
          type: integer
          description: The Reservation ID
        extraTypeId:
          type: integer
          description: The Extra Type ID
        variationId:
          type: integer
          description: The Extra Type variation ID
        quantity:
          type: integer
          description: Quantity of the extra being booked
        price:
          type: number
          format: float
          description: Price per unit
        dynamicPricing:
          type: object
          description: Map of variations with their quantities and prices
          required:
            - range
            - roomTypePrice
            - limit
          properties:
            limit:
              type: string
              description: End date for the dynamic pricing
            range:
              type: object
              description: Quantity of the extra being booked
              properties:
                fromHour:
                  type: integer
                  description: Start time (in hours) for applying dynamic pricing rules
                toHour:
                  type: integer
                  description: End time (in hours) for applying dynamic pricing rules
                roomRatePercentage:
                  type: integer
                  description: Room rate percentage used for dynamic pricing
            roomTypePrice:
              type: object
              description: Dynamic pricing details (required only for dynamic pricing model)
              properties:
                amount:
                  type: number
                  format: float
                  description: Price
                currency:
                  type: string
                  description: Currency
        touchpoint:
          $ref: "#/components/schemas/Touchpoint"
        sourceChannel:
          $ref: "#/components/schemas/SourceChannel"
    SaveUpgradeBidRequest:
      type: object
      required:
        - hotelId
        - reservationId
        - roomTypeId
        - amount
        - touchpoint
        - sourceChannel
      properties:
        hotelId:
          type: integer
          description: The Hotel ID
        reservationId:
          type: integer
          description: The Reservation ID
        roomTypeId:
          type: integer
          description: The Room Type ID
        wasHighlightedRoom:
          type: boolean
          description: Room type was previously highlighted
        amount:
          type: number
          format: float
          description: Amount of the upgrade bid
        touchpoint:
          $ref: "#/components/schemas/Touchpoint"
        sourceChannel:
          $ref: "#/components/schemas/SourceChannel"
    Touchpoint:
      type: string
      enum:
        - AT_RESERVATION
        - RESERVATION_CONFIRMATION
        - PRE_ARRIVAL_UPSELLING
        - PRE_ARRIVAL_UPSELLING_REMINDER
        - ALTERNATIVE_UPGRADE
        - GUEST_RETARGETING
        - REGISTRATION_CARD
        - FRONT_DESK
        - SPA
        - F_AND_B
        - INHOUSE_EXTRAS
        - HOTEL_DIRECTORY
    SourceChannel:
      type: string
      enum:
        - EMAIL
        - SMS
        - WHATSAPP
        - QR_CODE
        - AT_DESK
        - PHONE
    WebhookEventType:
      type: string
      description: |
        Type of a webhook event: one type per resource. `TEST` is only sent through the test endpoint and
        cannot be subscribed to.
      enum:
        - BOOKED_EXTRA
        - UPGRADE_BID
        - ROOM_UPGRADE
        - TEST
    WebhookEndpointStatus:
      type: string
      enum:
        - ACTIVE
        - PAUSED
    NewWebhookEndpoint:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Public `https` URL that receives the deliveries
        eventTypes:
          type: array
          description: Event types to subscribe to
          items:
            $ref: "#/components/schemas/WebhookEventType"
    WebhookEndpointUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        eventTypes:
          type: array
          description: Replaces the current subscriptions
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          $ref: "#/components/schemas/WebhookEndpointStatus"
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          $ref: "#/components/schemas/WebhookEndpointStatus"
        consecutiveFailures:
          type: integer
          description: Failed attempts since the last acknowledged delivery
        pausedAt:
          type: string
          format: date-time
          nullable: true
        pauseReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatedWebhookEndpoint:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - $ref: "#/components/schemas/WebhookSecret"
    ArrayOfWebhookEndpoint:
      type: array
      items:
        $ref: "#/components/schemas/WebhookEndpoint"
    WebhookSecret:
      type: object
      properties:
        secret:
          type: string
          description: Signing secret, `whsec_` followed by the base64-encoded key
          example: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
    WebhookTestEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        deliveryId:
          type: integer
    WebhookDeliveryStatus:
      type: string
      enum:
        - PENDING
        - SUCCEEDED
        - FAILED
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: string
          format: uuid
        eventType:
          $ref: "#/components/schemas/WebhookEventType"
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attemptCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastAttemptedAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastResponseStatus:
          type: integer
          nullable: true
          description: HTTP status your endpoint answered with; null when no response was received
        lastResponseBody:
          type: string
          nullable: true
          description: First 1 KB of your endpoint's response body
        lastError:
          type: string
          nullable: true
        lastDurationMs:
          type: integer
          nullable: true
    WebhookDeliveryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to read the next page; null on the last page
    WebhookEventEnvelope:
      type: object
      description: Body of every webhook delivery
      properties:
        id:
          type: string
          format: uuid
          description: Unique event id, also sent as the `webhook-id` header. Use it to de-duplicate.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        createdAt:
          type: string
          format: date-time
          description: When the event was published (UTC), not when the change happened
        hotelId:
          type: integer
          nullable: true
          description: Hotel the event is about; null for the test event
        data:
          type: object
          description: Current state of the resource the event is about, in the same shape as an item of its `GET` listing
  parameters:
    WebhookEndpointId:
      in: path
      name: webhookEndpointId
      required: true
      description: The webhook endpoint ID
      schema:
        type: integer
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
