        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /users/generate_access_token/{userId}:
    post:
      tags:
        - users
      operationId: generateUserAccessToken
      parameters:
        - in: path
          name: userId
          required: true
          description: The User ID
          schema:
            type: integer
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessToken'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /availability:
    post:
      tags:
        - availability
      operationId: pushAvailability
      description: Create or update room type availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelAvailability'
      responses:
        '204':
          description: OK
          content: { }
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /webhook_endpoints:
    get:
      tags:
        - webhooks
      operationId: getWebhookEndpoints
      description: List the API account's webhook endpoints. Requires the `webhook_endpoints.read` scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfWebhookEndpoint'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
    post:
      tags:
        - webhooks
      operationId: createWebhookEndpoint
      description: |
        Register a webhook endpoint. The response is the only time the signing secret is returned, apart from
        rotating it. Requires the `webhook_endpoints.write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWebhookEndpoint'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhookEndpoint'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /webhook_endpoints/{webhookEndpointId}:
    get:
      tags:
        - webhooks
      operationId: getWebhookEndpoint
      description: Retrieve a webhook endpoint. Requires the `webhook_endpoints.read` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Validation Exception, including an unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
    post:
      tags:
        - webhooks
      operationId: updateWebhookEndpoint
      description: |
        Update a webhook endpoint. Only the fields present in the body are changed. Setting `status` to
        `ACTIVE` resumes a paused endpoint and sends the deliveries that were waiting. Requires the
        `webhook_endpoints.write` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Validation Exception, including an unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
    delete:
      tags:
        - webhooks
      operationId: deleteWebhookEndpoint
      description: |
        Delete a webhook endpoint. Deliveries still waiting for it are not sent. Requires the
        `webhook_endpoints.write` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '204':
          description: Deleted
          content: { }
        '400':
          description: Validation Exception, including an unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /webhook_endpoints/rotate_secret/{webhookEndpointId}:
    post:
      tags:
        - webhooks
      operationId: rotateWebhookEndpointSecret
      description: |
        Replace the endpoint's signing secret. The new secret applies immediately, including to retries of
        earlier events. Requires the `webhook_endpoints.write` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecret'
        '400':
          description: Validation Exception, including an unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /webhook_endpoints/test/{webhookEndpointId}:
    post:
      tags:
        - webhooks
      operationId: sendWebhookTestEvent
      description: |
        Queue a `TEST` event for an active endpoint. Follow its outcome with the deliveries endpoint.
        Requires the `webhook_endpoints.write` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestEvent'
        '400':
          description: Validation Exception, including an unknown or paused endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /webhook_endpoints/deliveries/{webhookEndpointId}:
    get:
      tags:
        - webhooks
      operationId: getWebhookDeliveries
      description: |
        List the endpoint's deliveries from the last 30 days, newest first. Pass `nextCursor` from a response
        as `cursor` to read the next page. Requires the `webhook_endpoints.read` scope.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - in: query
          name: cursor
          required: false
          description: The `nextCursor` of the previous page
          schema:
            type: string
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '400':
          description: Validation Exception, including an unknown endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
