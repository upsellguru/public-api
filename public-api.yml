              format: date-time
            hotelId:
              type: integer
            variations:
              type: array
              items:
                $ref: "#/components/schemas/ExtraTypeVariation"
            pictures:
              type: array
              items:
                $ref: "#/components/schemas/PictureUrl"
    ExtraTypeLite:
      type: object
      properties:
        id:
          type: integer
        code:
