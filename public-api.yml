  - name: webhooks
    description: |
      Webhook endpoints let UpsellGuru push events to your system instead of you polling the API.

      ## Registration

      Register up to 10 endpoints per API account with `POST /webhook_endpoints`. Each endpoint has its own
      URL, its own signing secret and the list of event types it subscribes to. The URL must use `https` and
      point to a public host; redirects are not followed.

      The signing secret is returned only when the endpoint is created and when it is rotated with
      `POST /webhook_endpoints/rotate_secret/{webhookEndpointId}`. Store it securely. A rotated secret takes
      effect immediately: every attempt after the rotation, including retries of earlier events, is signed
      with the new secret.

      Managing endpoints requires the `webhook_endpoints.read` scope (list, get, deliveries) and the
      `webhook_endpoints.write` scope (create, update, delete, rotate secret, send a test event). Accounts
      without scope restrictions have both.

      ## Payload

      Every delivery is a `POST` with a JSON body (see `WebhookEventEnvelope`):

      ```json
      {
        "id": "4f0b9e1c-0a4e-4b8e-9d55-6c1f2f3e7a10",
        "type": "TEST",
        "createdAt": "2026-11-20T10:00:00Z",
        "hotelId": 123,
        "data": { }
      }
      ```

      An event means "this resource changed". `data` carries the resource's current state, in the same shape
      as an item of the matching `GET` listing, read when the event was processed. It may therefore already
      include later changes, and two events for the same resource can carry the same state; an identical
      state is not sent twice in a row. `hotelId` is `null` for the test event.

      Changes to the nested `reservation` and `reconciliation` objects do not trigger an event on their own,
      so those fields may be newer in the `GET` listing than in the last event you received.

      ## Event types

      ### BOOKED_EXTRA

      Requires the `booked_extras.read` scope. Sent when a booked extra is created, including booked extras
      created through `POST /booked_extras`, when its status changes (confirmed, rejected, expired, cancelled or
      reinstated), and when its quantity, amount or assigned user changes.

      `data` is an item of the `GET /booked_extras` listing (see `BookedExtra`):

      ```json
      {
        "id": "0d9a7c2e-5b1f-4e0a-8c3d-2f6b9e4a1c75",
        "type": "BOOKED_EXTRA",
        "createdAt": "2026-11-20T10:00:00Z",
        "hotelId": 123,
        "data": {
          "id": 98765,
          "createdAt": "2026-11-19T18:02:11Z",
          "updatedAt": "2026-11-20T09:59:58Z",
          "status": "CONFIRMED",
          "touchpoint": "PRE_ARRIVAL_UPSELLING",
          "sourceChannel": "EMAIL",
          "user": { "id": 42, "fullName": "Jane Smith" },
          "extraType": { "id": 555, "code": "SPA60", "category": "SPA" },
          "amount": { "amount": 80, "currency": "EUR" },
          "reconciliation": {
            "lastUpdate": null,
            "status": "PENDING",
            "errors": [],
            "metadata": [],
            "user": null
          },
          "quantity": 2,
          "reservation": {
            "uuid": "6c1e2a9b-3f4d-4e8a-b7c5-1d2e3f4a5b6c",
            "status": "CONFIRMED",
            "checkin": "2026-12-01",
            "checkout": "2026-12-04",
            "roomTypeCode": "DBL",
            "bookedRoomTypeCode": "DBL",
            "reference": "ABC123",
            "ratePlan": "BAR",
            "marketSegment": null,
            "reservationSource": null
          }
        }
      }
      ```

      ### UPGRADE_BID

      Documented with UP-2464.

      ### ROOM_UPGRADE

      Documented with UP-2465.

      ## Verifying a delivery

      Deliveries are signed following the [Standard Webhooks](https://www.standardwebhooks.com)
      specification, so its open-source libraries can verify them. Each request carries these headers:

      | Header | Value |
      |---|---|
      | `webhook-id` | The event `id`. The same on every retry of the event. |
      | `webhook-timestamp` | Unix time, in seconds, of this attempt. |
      | `webhook-signature` | `v1,` followed by the base64-encoded signature. |

      To verify a delivery yourself:

      1. Drop the `whsec_` prefix from your secret and base64-decode the rest to get the key.
      2. Compute HMAC-SHA256 with that key over `{webhook-id}.{webhook-timestamp}.{raw request body}`.
      3. Base64-encode the result and compare it, in constant time, to the value after `v1,`.
      4. Reject requests whose `webhook-timestamp` is more than a few minutes away from your clock.

      Always verify against the raw body exactly as received, before parsing it.

      ## Responding

      Respond with any `2xx` status within 10 seconds to acknowledge a delivery. Anything else, including a
      timeout or a redirect, counts as a failure. Do the processing asynchronously if it can take longer.

      ## Retries and guarantees

      * **At least once.** A failed delivery is retried 1 minute, 5 minutes, 30 minutes, 2 hours, 6 hours,
        12 hours and 24 hours after the previous attempt: 8 attempts over about 45 hours. After that the
        delivery is marked `FAILED`. The same event can occasionally arrive more than once, so de-duplicate
        on `id`.
      * **No ordering guarantee.** Retries and parallel delivery mean events can arrive out of order, so an
        older state can arrive after a newer one. Upsert by the resource `id` and compare its `updatedAt`, or
        fetch the resource from the API when you need certainty.
      * **Access.** An endpoint only receives events for hotels its API account can access, and only when the
        account has the read scope of the resource. Access is checked again before every attempt.

      ## Paused endpoints

      An endpoint is paused automatically when one of its deliveries has used up all its attempts without the
      endpoint acknowledging any delivery in between. UpsellGuru is notified when this happens. You can also
      pause an endpoint yourself by setting its `status` to `PAUSED`.

      While an endpoint is paused, new events are not delivered to it. Deliveries that were already waiting
      are sent once the endpoint is resumed by setting its `status` back to `ACTIVE`.

      ## Testing and monitoring

      `POST /webhook_endpoints/test/{webhookEndpointId}` sends a `TEST` event to an active endpoint.
      `GET /webhook_endpoints/deliveries/{webhookEndpointId}` lists recent deliveries and their outcome,
      newest first. Delivery history is kept for 30 days.

paths:
  /hotels:
    get:
      tags:
        - hotels
      operationId: getHotels
      description: Retrieve list of hotels the API account has access to
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfHotel'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /upgrade_bids:
    get:
      tags:
        - upgradeBids
      operationId: getUpgradeBidsList
      parameters:
        - in: query
          name: hotelId
          required: true
          description: The Hotel ID
          schema:
            type: integer
        - in: query
          name: dateFrom
          required: true
          description: Start of the date range to filter by (inclusive). The field filtered on is determined by `dateType`.
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          required: true
          description: End of the date range to filter by (inclusive). The field filtered on is determined by `dateType`.
          schema:
            type: string
            format: date
        - in: query
          name: dateType
          required: false
          description: Selects which date field the `dateFrom`/`dateTo` range is applied to. When omitted, the legacy default filter is used.
          schema:
            $ref: '#/components/schemas/DateType'
      description: Retrieve list of upgrade bids by hotel Id the API account has access to
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfUpgradeBid'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
    post:
      tags:
        - upgradeBids
      operationId: saveUpgradeBid
      description: Create a new Upgrade Bid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveUpgradeBidRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  upgradeBid:
                    $ref: '#/components/schemas/UpgradeBid'
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
  /upgrade_bids/change_status/{upgradeBidId}:
    post:
      tags:
        - upgradeBids
      operationId: changeUpgradeBidStatus
      parameters:
        - in: path
          name: upgradeBidId
          required: true
          description: The Upgrade Bid ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOfUpgradeBidStatusRequest'
      description: Change the status of an upgrade bid
      responses:
        '204':
          description: OK
          content: {}
        '400':
          description: Validation Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Security Exception
          content: { }
        '403':
          description: Security Exception
          content: { }
      security:
        - apiKey: [ ]
